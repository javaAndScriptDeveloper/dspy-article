[project]
name = "dspy-incident-triage"
version = "0.1.0"
description = "Working companion code for the DSPy article on codewithkyryl.dev — GEPA vs MIPROv2 on a Spring Boot incident triage task"
requires-python = ">=3.11"
dependencies = [
    "dspy[optuna]>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dspy_incident_triage"]
